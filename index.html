<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tangle</title>
<style>
  :root { --bg: #f6f5f1; --card: #fff; --fg: #1d1d1b; --muted: #6a6a64; --line: #dcdad2; --accent: #c2410c; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --fg: #ecebe6; --muted: #9a998f; --line: #34342f; --accent: #fb923c; --on-accent: #1a1209; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 8px 0 0; letter-spacing: .02em; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .layout { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 1fr 340px; }
    #side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; } /* Space stays in view */
  }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  section, .bar { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  label { display: block; margin-bottom: 10px; }
  label > span { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
  output { font-variant-numeric: tabular-nums; color: var(--fg); }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  select, input[type=text], button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; max-width: 100%; }
  label select { width: 100%; margin-top: 4px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; min-width: 84px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .kb { position: relative; display: flex; height: 92px; margin-bottom: 10px; }
  .kb button { padding: 0; font-size: 11px; cursor: pointer; }
  .kb .w { position: relative; flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; background: #faf9f5; color: #55554f; border: 1px solid #b9b7ac; border-radius: 0 0 5px 5px; }
  .kb .b { position: absolute; top: 0; z-index: 1; width: 8.5%; height: 58%; transform: translateX(-50%); background: #26261f; color: #ddd; border: 1px solid #000; border-radius: 0 0 4px 4px; }
  .kb .w.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .kb .b.on { background: color-mix(in srgb, var(--accent) 65%, #000); border-color: var(--accent); }
  .kb .root::before { content: ""; position: absolute; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: currentColor; }
  .kb .w.root::before { bottom: 22px; }
  .kb .b.root::before { bottom: 6px; }
  .pad { display: block; width: 100%; max-width: 320px; margin: 0 auto 10px; touch-action: none; }
  .pad .ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .pad .head { fill: var(--muted); stroke: none; }
  .pad .vp { cursor: grab; }
  .pad .live { fill: var(--fg); stroke: var(--card); stroke-width: 1.5; pointer-events: none; }
  .pad .vp.held { cursor: grabbing; }
  .pad .vp.held circle { stroke: var(--fg); stroke-width: 2; }
  .pad .vp circle { fill: var(--accent); }
  .pad .vp text { fill: var(--on-accent); font-size: 11px; font-weight: 700; pointer-events: none; }
  #status { color: var(--muted); font-size: 13px; }
</style>
<main>
  <header><h1>tangle</h1><button id="go" class="primary" aria-pressed="false">start</button></header>
  <div class="bar" id="presets"></div>
  <div class="layout"><div class="grid" id="app"></div><aside id="side"></aside></div>
</main>
<script type="module" src="/src/main.ts"></script>
